# Free Render demo server: sleeps when idle, and records reset on restart.
# For continuous 24/7 play use an always-on plan and a persistent disk.
services:
  - type: web
    name: terms-apply
    runtime: node
    plan: free
    buildCommand: npm ci && npm test && npm run build:client
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_TOKEN
        generateValue: true
      - key: OPENROUTER_API_KEY
        sync: false
